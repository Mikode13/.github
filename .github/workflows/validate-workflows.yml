name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: workflow and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check

      - name: Run the offline workflow test suite
        run: pnpm test

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml workflow-templates/*.yml

  # This repository ships the Documentation capability to every other one, so it runs it over
  # its own Markdown too. `static` only formats: markdownlint's structure rules and the
  # internal-link check live here, and a duplicate heading in README.md survived on main until
  # this job existed. The scan covers `fixtures/` as well, which costs seconds and is harmless
  # -- those files already pass under their own fixture jobs.
  own_documentation:
    name: this repository's documentation
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      working_directory: .

  node:
    name: node fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: node
      working_directory: fixtures/node
      run_build: true

  package:
    name: package fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: package
      working_directory: fixtures/package
      run_build: true

  docs:
    name: legacy documentation fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: docs
      working_directory: fixtures/docs

  capabilities:
    name: explicit capability fixture
    uses: ./.github/workflows/ci.yml
    with:
      source: true
      tests: true
      build: true
      package: true
      working_directory: fixtures/package

  docs_content:
    name: content-only documentation fixture
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      working_directory: fixtures/docs-content

  docs_source:
    name: source and documentation fixture
    # Both capabilities over the same Markdown. Source formats it with the repository's own
    # resolution of @mikode13/code-style; Documentation formats it with the pinned central
    # toolchain. They must agree, and this is the only place that proves it end to end.
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      source: true
      working_directory: fixtures/docs-source

  plugin_content:
    name: content-only plugin fixture
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      documentation_plugin_versions: true
      working_directory: fixtures/plugin

  end_to_end:
    name: end-to-end fixture
    uses: ./.github/workflows/ci.yml
    with:
      end_to_end: true
      working_directory: fixtures/e2e
      lockfile_path: fixtures/e2e/pnpm-lock.yaml

  toolchain_mechanics:
    name: release toolchain mechanics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exercises the exact mechanics release.yml's release job uses, against this
      # pull request's own commit. This is what the offline scripts/test-release-
      # toolchain.mjs run (part of the static job above) cannot catch on its own: it
      # never invokes the real actions/checkout action, so it could not have caught
      # actions/checkout refusing a path outside GITHUB_WORKSPACE (confirmed by running
      # the pinned action locally with this exact input before this job existed).
      - name: Checkout the pinned release toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .mikode-release-toolchain
          sparse-checkout: release-toolchain
          persist-credentials: false

      - name: Move the release toolchain out of the consumer's tree
        run: mv "$GITHUB_WORKSPACE/.mikode-release-toolchain" "$RUNNER_TEMP/mikode-release-toolchain"

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the release toolchain mechanics end to end
        env:
          RELEASE_TOOLCHAIN_DIRECTORY: ${{ runner.temp }}/mikode-release-toolchain/release-toolchain
        run: pnpm exec vitest run --project integration tests/integration/releaseToolchain.integration.test.ts

  ai_review_smoke:
    name: AI review action smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the proposed actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This fixture runs under pull_request, with no environment or provider credential. It
      # replaces only the CI check and the publisher's GitHub writes; both composite actions
      # still execute through the runner, including their output and failure semantics.
      - name: Stub the CI check and status publication
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ai-review-smoke-bin"
          cat > "$RUNNER_TEMP/ai-review-smoke-bin/gh" <<'SH'
          #!/usr/bin/env bash
          if [[ "$1" != api ]]; then exit 1; fi
          case "$2" in
            repos/*/commits/*/check-runs*) echo failure ;;
            repos/*/statuses/*) printf '%s\n' "$*" >> "$AI_REVIEW_SMOKE_STATUS" ;;
            *) echo "Unexpected gh API request: $2" >&2; exit 1 ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/ai-review-smoke-bin/gh"
          echo "$RUNNER_TEMP/ai-review-smoke-bin" >> "$GITHUB_PATH"
          echo "AI_REVIEW_SMOKE_STATUS=$RUNNER_TEMP/ai-review-smoke-status" >> "$GITHUB_ENV"

      - name: Analyze a failing CI check without a provider credential
        if: github.event_name == 'pull_request'
        id: analyze_smoke
        continue-on-error: true
        uses: ./ai-review/analyze
        with:
          provider_token: ''

      - name: Publish against the local API fixture
        if: github.event_name == 'pull_request'
        id: publish_smoke
        continue-on-error: true
        uses: ./ai-review/publish
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/tests/fixtures/ai-review-smoke-api.mjs
          AI_REVIEW_SMOKE_REQUESTS: ${{ runner.temp }}/ai-review-smoke-requests.jsonl
        with:
          analyze_result: ${{ steps.analyze_smoke.outcome }}
          report: ${{ steps.analyze_smoke.outputs.report }}

      - name: Verify the actions failed closed and published only to fixtures
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze_smoke.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_smoke.outcome }}
          REPORT: ${{ steps.analyze_smoke.outputs.report }}
        run: |
          [[ "$ANALYZE_OUTCOME" == failure && "$PUBLISH_OUTCOME" == failure ]]
          jq -e '.outcome == "incomplete" and (.errors[0] | contains("CI / required"))' <<< "$REPORT"
          jq -e 'select(.method == "POST" and (.route | endswith("/comments"))) | .body | fromjson | .body | contains("CI / required")' \
            "$RUNNER_TEMP/ai-review-smoke-requests.jsonl"
          grep -q 'state=failure' "$AI_REVIEW_SMOKE_STATUS"

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - static
      - own_documentation
      - node
      - package
      - docs
      - capabilities
      - docs_content
      - docs_source
      - plugin_content
      - end_to_end
      - toolchain_mechanics
      - ai_review_smoke
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CAPABILITIES_RESULT: ${{ needs.capabilities.result }}
      DOCS_CONTENT_RESULT: ${{ needs.docs_content.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      DOCS_SOURCE_RESULT: ${{ needs.docs_source.result }}
      PLUGIN_CONTENT_RESULT: ${{ needs.plugin_content.result }}
      E2E_RESULT: ${{ needs.end_to_end.result }}
      NODE_RESULT: ${{ needs.node.result }}
      OWN_DOCUMENTATION_RESULT: ${{ needs.own_documentation.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      STATIC_RESULT: ${{ needs.static.result }}
      TOOLCHAIN_MECHANICS_RESULT: ${{ needs.toolchain_mechanics.result }}
      AI_REVIEW_SMOKE_RESULT: ${{ needs.ai_review_smoke.result }}
    steps:
      - name: Verify validation jobs
        shell: bash
        run: |
          failed=false

          for result in \
            "static:$STATIC_RESULT" \
            "own-documentation:$OWN_DOCUMENTATION_RESULT" \
            "node:$NODE_RESULT" \
            "package:$PACKAGE_RESULT" \
            "docs:$DOCS_RESULT" \
            "capabilities:$CAPABILITIES_RESULT" \
            "docs-content:$DOCS_CONTENT_RESULT" \
            "docs-source:$DOCS_SOURCE_RESULT" \
            "plugin-content:$PLUGIN_CONTENT_RESULT" \
            "end-to-end:$E2E_RESULT" \
            "toolchain-mechanics:$TOOLCHAIN_MECHANICS_RESULT" \
            "ai-review-smoke:$AI_REVIEW_SMOKE_RESULT"
          do
            job="${result%%:*}"
            status="${result#*:}"

            if [[ "$status" != success ]]; then
              echo "::error::$job finished with '$status'; expected 'success'"
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi
