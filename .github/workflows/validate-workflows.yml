name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: workflow and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml workflow-templates/*.yml

  node:
    name: node fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: node
      working_directory: fixtures/node
      run_build: true

  package:
    name: package fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: package
      working_directory: fixtures/package
      run_build: true

  docs:
    name: legacy documentation fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: docs
      working_directory: fixtures/docs

  capabilities:
    name: explicit capability fixture
    uses: ./.github/workflows/ci.yml
    with:
      source: true
      tests: true
      build: true
      package: true
      working_directory: fixtures/package

  docs_content:
    name: content-only documentation fixture
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      working_directory: fixtures/docs-content

  docs_source:
    name: source and documentation fixture
    # Both capabilities over the same Markdown. Source formats it with the repository's own
    # resolution of @mikode13/code-style; Documentation formats it with the pinned central
    # toolchain. They must agree, and this is the only place that proves it end to end.
    uses: ./.github/workflows/ci.yml
    with:
      documentation: true
      source: true
      working_directory: fixtures/docs-source

  end_to_end:
    name: end-to-end fixture
    uses: ./.github/workflows/ci.yml
    with:
      end_to_end: true
      working_directory: fixtures/e2e
      lockfile_path: fixtures/e2e/pnpm-lock.yaml

  toolchain_mechanics:
    name: release toolchain mechanics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exercises the exact mechanics release.yml's release job uses, against this
      # pull request's own commit. This is what the offline scripts/test-release-
      # toolchain.mjs run (part of the static job above) cannot catch on its own: it
      # never invokes the real actions/checkout action, so it could not have caught
      # actions/checkout refusing a path outside GITHUB_WORKSPACE (confirmed by running
      # the pinned action locally with this exact input before this job existed).
      - name: Checkout the pinned release toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .mikode-release-toolchain
          sparse-checkout: release-toolchain
          persist-credentials: false

      - name: Move the release toolchain out of the consumer's tree
        run: mv "$GITHUB_WORKSPACE/.mikode-release-toolchain" "$RUNNER_TEMP/mikode-release-toolchain"

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Verify the release toolchain mechanics end to end
        env:
          RELEASE_TOOLCHAIN_DIRECTORY: ${{ runner.temp }}/mikode-release-toolchain/release-toolchain
        run: node scripts/test-release-toolchain.mjs

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - static
      - node
      - package
      - docs
      - capabilities
      - docs_content
      - docs_source
      - end_to_end
      - toolchain_mechanics
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CAPABILITIES_RESULT: ${{ needs.capabilities.result }}
      DOCS_CONTENT_RESULT: ${{ needs.docs_content.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      DOCS_SOURCE_RESULT: ${{ needs.docs_source.result }}
      E2E_RESULT: ${{ needs.end_to_end.result }}
      NODE_RESULT: ${{ needs.node.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      STATIC_RESULT: ${{ needs.static.result }}
      TOOLCHAIN_MECHANICS_RESULT: ${{ needs.toolchain_mechanics.result }}
    steps:
      - name: Verify validation jobs
        shell: bash
        run: |
          failed=false

          for result in \
            "static:$STATIC_RESULT" \
            "node:$NODE_RESULT" \
            "package:$PACKAGE_RESULT" \
            "docs:$DOCS_RESULT" \
            "capabilities:$CAPABILITIES_RESULT" \
            "docs-content:$DOCS_CONTENT_RESULT" \
            "docs-source:$DOCS_SOURCE_RESULT" \
            "end-to-end:$E2E_RESULT" \
            "toolchain-mechanics:$TOOLCHAIN_MECHANICS_RESULT"
          do
            job="${result%%:*}"
            status="${result#*:}"

            if [[ "$status" != success ]]; then
              echo "::error::$job finished with '$status'; expected 'success'"
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi
