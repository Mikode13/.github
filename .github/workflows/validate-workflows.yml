name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: workflow and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --silent --show-error "$url" --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint"

  node:
    name: node fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: node
      working_directory: fixtures/node
      run_build: true

  package:
    name: package fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: package
      working_directory: fixtures/package
      run_build: true

  docs:
    name: documentation fixture
    uses: ./.github/workflows/ci.yml
    with:
      profile: docs
      working_directory: fixtures/docs

  required:
    name: required
    if: ${{ always() }}
    needs:
      - static
      - node
      - package
      - docs
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DOCS_RESULT: ${{ needs.docs.result }}
      NODE_RESULT: ${{ needs.node.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      STATIC_RESULT: ${{ needs.static.result }}
    steps:
      - name: Verify validation jobs
        shell: bash
        run: |
          failed=false

          for result in \
            "static:$STATIC_RESULT" \
            "node:$NODE_RESULT" \
            "package:$PACKAGE_RESULT" \
            "docs:$DOCS_RESULT"
          do
            job="${result%%:*}"
            status="${result#*:}"

            if [[ "$status" != success ]]; then
              echo "::error::$job finished with '$status'; expected 'success'"
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi
