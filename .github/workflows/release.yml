name: Reusable release

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          Exact commit SHA to release. The caller must have already established that this
          SHA belongs to its default branch (for example from
          github.event.workflow_run.head_sha, or an operator-supplied SHA for manual
          recovery) -- this workflow independently re-verifies it regardless.
        required: true
        type: string
      working_directory:
        description: Directory containing the project package.json.
        default: .
        type: string
      lockfile_path:
        description: Path to pnpm-lock.yaml, relative to the repository root.
        default: pnpm-lock.yaml
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: authorize release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    outputs:
      should-release: ${{ steps.verify.outputs.should-release }}
    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          LOCKFILE_PATH: ${{ inputs.lockfile_path }}
          SHA: ${{ inputs.sha }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA, got: $SHA"
            exit 1
          fi

          if [[ -z "$WORKING_DIRECTORY" || "$WORKING_DIRECTORY" == /* || "$WORKING_DIRECTORY" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::working_directory must be a repository-relative path without '..' segments"
            exit 1
          fi

          if [[ -z "$LOCKFILE_PATH" || "$LOCKFILE_PATH" == /* || "$LOCKFILE_PATH" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::lockfile_path must be a repository-relative path without '..' segments"
            exit 1
          fi

      - name: Verify the commit has a successful CI / required check on main
        id: verify
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const sha = process.env.SHA;
          const repository = process.env.REPOSITORY;

          function ghApiGet(path, params) {
            const args = ['api', '--method', 'GET', path];
            for (const [key, value] of Object.entries(params)) {
              args.push('-f', `${key}=${value}`);
            }
            return JSON.parse(execFileSync('gh', args, { encoding: 'utf8' }));
          }

          // The workflow name is intentionally not configurable: a caller choosing which
          // workflow's success gates its own release would defeat the point of the gate.
          const runsResponse = ghApiGet(`repos/${repository}/actions/runs`, {
            head_sha: sha,
            branch: 'main',
            event: 'push',
            status: 'completed',
          });

          const run = (runsResponse.workflow_runs ?? []).find(
            candidate =>
              candidate.name === 'CI' &&
              candidate.conclusion === 'success' &&
              candidate.head_sha === sha,
          );

          if (!run) {
            console.error(`::error::No successful push CI run found on main for ${sha}`);
            process.exit(1);
          }

          // A successful workflow run is not the same guarantee as the exact status that
          // gates merges. Verify the 'CI / required' check itself, in the same check
          // suite as the run just confirmed.
          const checkRunsResponse = ghApiGet(`repos/${repository}/commits/${sha}/check-runs`, {});

          const requiredCheck = (checkRunsResponse.check_runs ?? []).find(
            checkRun =>
              checkRun.name === 'CI / required' &&
              checkRun.conclusion === 'success' &&
              checkRun.check_suite?.id === run.check_suite_id,
          );

          if (!requiredCheck) {
            console.error(`::error::No successful 'CI / required' check found for ${sha}`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should-release=true\n');

  release:
    name: release
    needs: authorize
    if: ${{ needs.authorize.outputs.should-release == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository at the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify the package is set up for automated releases
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if [[ "$version" != "0.0.0-development" ]]; then
            echo "::error::package.json version must be 0.0.0-development (semantic-release sets the real version); found $version"
            exit 1
          fi

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install a recent npm supporting Trusted Publishing
        run: npm install --global npm@11.19.1

      - name: Configure the npm registry
        # Explicit rather than relying on npm's default: npm's own docs are not fully
        # conclusive on whether OIDC trusted publishing engages without this being set.
        run: npm config set registry "https://registry.npmjs.org/"

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Build the package
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run --if-present build

      - name: Determine the release toolchain revision
        id: toolchain
        shell: bash
        env:
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actionlint (1.7.12, current latest) does not model workflow_sha/
          # workflow_repository on the job context at all -- see .github/actionlint.yaml.
          # Verified empirically that both populate correctly for a job inside a workflow
          # invoked via workflow_call: a throwaway probe workflow calling a reusable
          # workflow echoed job.workflow_sha as the exact commit that defines the running
          # workflow, and job.workflow_repository as this repository.
          if [[ ! "$JOB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_sha did not resolve to a 40-character commit SHA: $JOB_WORKFLOW_SHA"
            exit 1
          fi

          if [[ -z "$JOB_WORKFLOW_REPOSITORY" ]]; then
            echo "::error::job.workflow_repository did not resolve to a repository"
            exit 1
          fi

          echo "sha=$JOB_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          echo "repository=$JOB_WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned release toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.toolchain.outputs.repository }}
          ref: ${{ steps.toolchain.outputs.sha }}
          # Must be relative: actions/checkout (including this pinned v7.0.1) resolves
          # path against GITHUB_WORKSPACE and refuses anything outside it, throwing
          # "Repository path '...' is not under '...'" before any network call --
          # confirmed by running the pinned action's own dist/index.js locally. Moved out
          # of the consumer's tree in the next step instead.
          path: .mikode-release-toolchain
          sparse-checkout: release-toolchain
          persist-credentials: false

      - name: Move the release toolchain out of the consumer's tree
        # Safe to move before the checkout action's own post-step cleanup runs: that
        # cleanup checks for .git/config at this original path and returns immediately
        # if it's missing, and persist-credentials: false above already removed any
        # injected credentials synchronously during the checkout step itself.
        run: mv "$GITHUB_WORKSPACE/.mikode-release-toolchain" "$RUNNER_TEMP/mikode-release-toolchain"

      - name: Install the release toolchain
        working-directory: ${{ runner.temp }}/mikode-release-toolchain/release-toolchain
        # --ignore-workspace: this checkout also contains this repository's own
        # pnpm-workspace.yaml, which does not list release-toolchain as a member (it is
        # deliberately excluded from the shared lockfile so its own dependency graph
        # stays frozen independently of everything else in this repository). Checked out
        # under runner.temp, not the consumer's own tree, so nothing it contains can ever
        # be picked up by the consumer's own tarball.
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Write semantic-release configuration
        shell: node {0}
        working-directory: ${{ runner.temp }}/mikode-release-toolchain/release-toolchain
        run: |
          const fs = require('node:fs');

          // Order matters: commit-analyzer stops evaluating rules once it reaches
          // 'major' (the highest severity), but a rule that resolves to `false` cannot
          // ever be overridden by a later rule once matched (compareReleaseTypes ranks
          // `false` as more severe than any real release type, since it has no index in
          // RELEASE_TYPES). Without the breaking-change rule evaluated first, a breaking
          // `perf` or `revert` commit would incorrectly produce no release at all.
          const rules = [
            { breaking: true, release: 'major' },
            { type: 'perf', release: false },
            { type: 'revert', release: false },
          ];

          const config = {
            branches: ['main'],
            plugins: [
              ['@semantic-release/commit-analyzer', { preset: 'conventionalcommits', releaseRules: rules }],
              ['@semantic-release/release-notes-generator', { preset: 'conventionalcommits' }],
              '@semantic-release/npm',
              [
                '@semantic-release/github',
                // Disabled rather than granting issues:write/pull-requests:write: these
                // defaults would let a hook 403 after npm publish and the GitHub Release
                // already succeeded, reporting an irreversible release as failed.
                { successComment: false, failComment: false, releasedLabels: false },
              ],
            ],
          };

          // Written into the toolchain checkout, never into the consumer's own working
          // directory: semantic-release resolves plugins named in an extended config
          // relative to that config file's own directory, so this is also what makes the
          // plugins resolve from the toolchain's node_modules rather than the consumer's
          // (verified empirically against a scratch repository with no local
          // node_modules at all, invoked with --extends pointing here).
          fs.writeFileSync('release.config.cjs', 'module.exports = ' + JSON.stringify(config) + ';\n');

      - name: Verify the package tarball contains every declared entry point
        shell: node {0}
        working-directory: ${{ inputs.working_directory }}
        run: |
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          function collectStringLeaves(node, into) {
            if (typeof node === 'string') {
              into.push(node);
              return;
            }
            if (node && typeof node === 'object') {
              for (const value of Object.values(node)) {
                collectStringLeaves(value, into);
              }
            }
          }

          const declared = [];
          for (const field of ['main', 'module', 'types', 'typings']) {
            if (typeof pkg[field] === 'string') {
              declared.push(pkg[field]);
            }
          }
          if (pkg.exports) {
            collectStringLeaves(pkg.exports, declared);
          }
          if (pkg.bin) {
            collectStringLeaves(pkg.bin, declared);
          }

          const declaredEntries = [...new Set(declared.map(entry => entry.replace(/^\.\//, '')))];

          const packOutput = execFileSync('npm', ['pack', '--dry-run', '--json'], {
            encoding: 'utf8',
          });
          const [report] = JSON.parse(packOutput);
          const packedFiles = new Set(report.files.map(file => file.path));

          const missing = declaredEntries.filter(entry => !packedFiles.has(entry));

          if (missing.length > 0) {
            console.error(
              `::error::The packed tarball is missing declared entry point(s): ${missing.join(', ')}`,
            );
            process.exit(1);
          }

          // Regression guard: the release config lives in the toolchain checkout under
          // runner.temp, never in this directory -- if it ever ends up here again, the
          // fix that moved it out of the consumer's tree has regressed.
          if (packedFiles.has('release.config.cjs')) {
            console.error('::error::The packed tarball must never contain release.config.cjs');
            process.exit(1);
          }

      - name: Publish release
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_DIR: ${{ runner.temp }}/mikode-release-toolchain/release-toolchain
        run: |
          node "$TOOLCHAIN_DIR/node_modules/semantic-release/bin/semantic-release.js" \
            --extends "$TOOLCHAIN_DIR/release.config.cjs"
