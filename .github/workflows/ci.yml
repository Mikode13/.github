name: Reusable CI

on:
  workflow_call:
    inputs:
      source:
        description: Enable the Source capability for this workflow revision.
        default: false
        type: boolean
      tests:
        description: Enable the Tests capability for this workflow revision.
        default: false
        type: boolean
      build:
        description: Enable the Build capability for this workflow revision.
        default: false
        type: boolean
      package:
        description: Enable the Package capability for this workflow revision.
        default: false
        type: boolean
      documentation:
        description: Enable the Documentation capability for this workflow revision.
        default: false
        type: boolean
      end_to_end:
        description: Enable the End-to-end capability for this workflow revision.
        default: false
        type: boolean
      profile:
        description: 'Legacy repository profile: node, package, or docs.'
        default: ''
        type: string
      working_directory:
        description: Directory containing project files.
        default: .
        type: string
      lockfile_path:
        description: Path to pnpm-lock.yaml, relative to the repository root.
        default: pnpm-lock.yaml
        type: string
      run_build:
        description: Legacy profile option to add the Build capability.
        default: false
        type: boolean
      run_e2e:
        description: Legacy profile option to add the End-to-end capability.
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    name: validate contract
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      documentation: ${{ steps.resolve.outputs.documentation }}
      end_to_end: ${{ steps.resolve.outputs.end_to_end }}
      package: ${{ steps.resolve.outputs.package }}
      source: ${{ steps.resolve.outputs.source }}
      tests: ${{ steps.resolve.outputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve workflow contract
        id: resolve
        shell: bash
        env:
          BUILD: ${{ inputs.build }}
          DOCUMENTATION: ${{ inputs.documentation }}
          END_TO_END: ${{ inputs.end_to_end }}
          LOCKFILE_PATH: ${{ inputs.lockfile_path }}
          PACKAGE: ${{ inputs.package }}
          PROFILE: ${{ inputs.profile }}
          RUN_BUILD: ${{ inputs.run_build }}
          RUN_E2E: ${{ inputs.run_e2e }}
          SOURCE: ${{ inputs.source }}
          TESTS: ${{ inputs.tests }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          validate_relative_path() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" || "$value" == /* || "$value" =~ (^|/)\.\.(/|$) ]]; then
              echo "::error::$name must be a repository-relative path without '..' segments"
              return 1
            fi
          }

          explicit=false
          if [[ "$SOURCE" == true || "$TESTS" == true || "$BUILD" == true || "$PACKAGE" == true || "$DOCUMENTATION" == true || "$END_TO_END" == true ]]; then
            explicit=true
          fi

          if [[ -n "$PROFILE" && "$explicit" == true ]]; then
            echo "::error::Use explicit capabilities or the legacy profile contract, not both"
            exit 1
          fi

          if [[ -z "$PROFILE" && "$explicit" == false ]]; then
            echo "::error::Enable at least one capability or provide a legacy profile"
            exit 1
          fi

          if [[ "$explicit" == true && ("$RUN_BUILD" == true || "$RUN_E2E" == true) ]]; then
            echo "::error::run_build and run_e2e belong to the legacy profile contract and cannot be mixed with explicit capabilities"
            exit 1
          fi

          if [[ -n "$PROFILE" ]]; then
            SOURCE=false
            TESTS=false
            BUILD=false
            PACKAGE=false
            DOCUMENTATION=false
            END_TO_END=false

            case "$PROFILE" in
              node)
                SOURCE=true
                TESTS=true
                ;;
              package)
                SOURCE=true
                TESTS=true
                PACKAGE=true
                ;;
              docs)
                DOCUMENTATION=true
                ;;
              *)
                echo "::error::profile must be one of: node, package, docs"
                exit 1
                ;;
            esac

            if [[ "$PROFILE" == docs && ("$RUN_BUILD" == true || "$RUN_E2E" == true) ]]; then
              echo "::error::The docs profile does not support build or end-to-end capabilities"
              exit 1
            fi

            [[ "$RUN_BUILD" == true ]] && BUILD=true
            [[ "$RUN_E2E" == true ]] && END_TO_END=true
          fi

          validate_relative_path working_directory "$WORKING_DIRECTORY"

          if [[ "$SOURCE" == true || "$TESTS" == true || "$BUILD" == true || "$PACKAGE" == true || "$END_TO_END" == true ]]; then
            validate_relative_path lockfile_path "$LOCKFILE_PATH"

            if [[ ! -f "$WORKING_DIRECTORY/package.json" ]]; then
              echo "::error::No package.json found in $WORKING_DIRECTORY"
              exit 1
            fi

            if [[ ! -f "$LOCKFILE_PATH" ]]; then
              echo "::error::No pnpm lockfile found at $LOCKFILE_PATH"
              exit 1
            fi
          fi

          {
            echo "source=$SOURCE"
            echo "tests=$TESTS"
            echo "build=$BUILD"
            echo "package=$PACKAGE"
            echo "documentation=$DOCUMENTATION"
            echo "end_to_end=$END_TO_END"
          } >> "$GITHUB_OUTPUT"

  metadata:
    name: pull request metadata
    if: ${{ github.event_name == 'pull_request' }}
    needs: contract
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          install: false

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm dlx @mikode13/git-hooks@0.1.0 lint-title "$PR_TITLE"

      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: pnpm dlx @mikode13/git-hooks@0.1.0 lint-branch "$SOURCE_BRANCH"

  check:
    name: check (Node.js 24)
    if: ${{ needs.contract.outputs.source == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run check

  test:
    name: test (Node.js ${{ matrix.node }})
    if: ${{ needs.contract.outputs.tests == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@${{ matrix.node }}
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Run offline tests
        working-directory: ${{ inputs.working_directory }}
        run: pnpm test

  build:
    name: build (Node.js ${{ matrix.node }})
    if: ${{ needs.contract.outputs.build == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@${{ matrix.node }}
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Build project
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run build

  pack:
    name: package dry run (Node.js 24)
    if: ${{ needs.contract.outputs.package == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Verify package contents
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run pack:check

  docs:
    name: documentation
    if: ${{ needs.contract.outputs.documentation == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install project documentation tooling
        if: ${{ inputs.profile == 'docs' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install project dependencies
        if: ${{ inputs.profile == 'docs' }}
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Validate legacy project documentation
        if: ${{ inputs.profile == 'docs' }}
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run docs:check

      - name: Install central documentation tooling
        if: ${{ inputs.profile == '' }}
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          install: false

      - name: Validate documentation formatting and structure
        if: ${{ inputs.profile == '' }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          mapfile -d '' markdown_files < <(find "$WORKING_DIRECTORY" -type f -name '*.md' -print0)

          if (( ${#markdown_files[@]} == 0 )); then
            echo "::error::Documentation capability requires at least one Markdown file"
            exit 1
          fi

          pnpm dlx prettier@3.9.6 --check "${markdown_files[@]}"
          pnpm dlx markdownlint-cli2@0.23.2 "${markdown_files[@]}"

      - name: Validate internal documentation links
        if: ${{ inputs.profile == '' }}
        working-directory: ${{ inputs.working_directory }}
        run: pnpm --package=remark-cli@12.0.1 --package=remark-validate-links@13.1.0 dlx remark --quiet --frail --use remark-validate-links .

  e2e:
    name: end-to-end (Node.js 24)
    if: ${{ needs.contract.outputs.end_to_end == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          cache-dependency-path: ${{ inputs.lockfile_path }}
          package-json-file: ${{ inputs.working_directory }}/package.json
          install: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ${{ inputs.working_directory }}
        run: pnpm exec playwright install --with-deps

      - name: Run end-to-end tests
        working-directory: ${{ inputs.working_directory }}
        run: pnpm run test:e2e

  required:
    name: required
    if: ${{ always() }}
    needs:
      - contract
      - metadata
      - check
      - test
      - build
      - pack
      - docs
      - e2e
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BUILD_ENABLED: ${{ needs.contract.outputs.build }}
      BUILD_RESULT: ${{ needs.build.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      CONTRACT_RESULT: ${{ needs.contract.result }}
      DOCS_ENABLED: ${{ needs.contract.outputs.documentation }}
      DOCS_RESULT: ${{ needs.docs.result }}
      E2E_ENABLED: ${{ needs.contract.outputs.end_to_end }}
      E2E_RESULT: ${{ needs.e2e.result }}
      EVENT_NAME: ${{ github.event_name }}
      METADATA_RESULT: ${{ needs.metadata.result }}
      PACKAGE_ENABLED: ${{ needs.contract.outputs.package }}
      PACK_RESULT: ${{ needs.pack.result }}
      SOURCE_ENABLED: ${{ needs.contract.outputs.source }}
      TESTS_ENABLED: ${{ needs.contract.outputs.tests }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Verify applicable jobs
        shell: bash
        run: |
          expect_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job finished with '$actual'; expected '$expected'"
              return 1
            fi
          }

          expect_capability() {
            local job="$1"
            local enabled="$2"
            local actual="$3"

            if [[ "$enabled" == true ]]; then
              expect_result "$job" "$actual" success
            else
              expect_result "$job" "$actual" skipped
            fi
          }

          failed=false

          expect_result contract "$CONTRACT_RESULT" success || failed=true

          if [[ "$EVENT_NAME" == pull_request ]]; then
            expect_result metadata "$METADATA_RESULT" success || failed=true
          else
            expect_result metadata "$METADATA_RESULT" skipped || failed=true
          fi

          expect_capability check "$SOURCE_ENABLED" "$CHECK_RESULT" || failed=true
          expect_capability test "$TESTS_ENABLED" "$TEST_RESULT" || failed=true
          expect_capability build "$BUILD_ENABLED" "$BUILD_RESULT" || failed=true
          expect_capability pack "$PACKAGE_ENABLED" "$PACK_RESULT" || failed=true
          expect_capability docs "$DOCS_ENABLED" "$DOCS_RESULT" || failed=true
          expect_capability e2e "$E2E_ENABLED" "$E2E_RESULT" || failed=true

          if [[ "$failed" == true ]]; then
            exit 1
          fi
