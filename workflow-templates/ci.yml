name: CI

on:
  pull_request:
    branches:
      - $default-branch
  push:
    branches:
      - $default-branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    # Initial MiKode CI release, validated on main after merge.
    uses: Mikode13/.github/.github/workflows/ci.yml@78523ec52c5a598be22e8682cee47409bbe9b4a5
    with:
      # Required: node, package, or docs.
      profile: package
      # Remove this input when the project does not expose pnpm run build.
      run_build: true
      # Enable only when the project exposes pnpm run test:e2e.
      # run_e2e: true
